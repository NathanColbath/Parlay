# Hello Engine template properties (STR-14).
#
# Engine version this template builds against. Keep in sync with the monorepo
# VERSION file. During development the engine is `-SNAPSHOT`.
stratixEngineVersion=0.1.0-SNAPSHOT

# Keeps first runs responsive in CI and on laptops.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
