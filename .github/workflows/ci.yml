name: CI

# QA-owned continuous integration. Runs on every change.
# Required status checks for the MVP branch: "Build & Test" jobs.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [17]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and enforce the quality gate
        run: ./gradlew check --no-daemon --stacktrace

      - name: Upload HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-${{ matrix.os }}-jdk${{ matrix.java }}
          path: "**/build/test-results/test/"
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-jdk${{ matrix.java }}
          path: "**/build/reports/jacoco/"
          if-no-files-found: ignore

  gpu-tests:
    name: GPU / display tests (Linux, xvfb)
    runs-on: ubuntu-latest
    needs: build-and-test
    # GPU/display-bound tests are opt-in and only run on PRs and main.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # `check` (not bare `test`) so GPU-backed modules are coverage-verified
      # against their *full* class set while the GPU suite is active. The
      # headless Build & Test jobs keep the default scoped rule (STR-31).
      - name: Run GPU-tagged tests and enforce the gate under a virtual display
        run: xvfb-run --auto-servernum ./gradlew check jacocoTestReport -Pstratix.qa.gpuTests=true --no-daemon --stacktrace

      - name: Upload GPU JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gpu-linux
          path: "**/build/reports/jacoco/"
          if-no-files-found: ignore
