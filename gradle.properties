# QA-owned build harness properties.

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# MVP quality gate: minimum line coverage for any module that ships main sources.
stratix.minLineCoverage=0.60

# Display/GPU-bound tests are tagged `gpu` and excluded unless explicitly enabled.
# CI enables these only on runners with a display (see .github/workflows/ci.yml).
stratix.qa.gpuTests=false

# Editor UI backend pins (ADR-0005). Single source of truth for the versions
# consumed by engine-imgui; never hard-code these anywhere else.
stratix.imguiVersion=1.92.7.1
stratix.lwjglVersion=3.4.1
